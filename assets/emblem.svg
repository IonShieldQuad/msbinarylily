<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 420 420" role="img" aria-labelledby="emblem-title">
  <title id="emblem-title">Ms Binary Lily — flower of glowing data-streams on a chip</title>
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- chip body -->
  <g fill="none" stroke="#2a2f3a" stroke-width="2">
    <path d="M210 66 322 130v128l-112 64-112-64V130z"/>
    <path d="M210 96 296 146v96l-86 50-86-50v-96z" opacity=".7"/>
  </g>

  <!-- traces -->
  <g fill="none" stroke="url(#holo)" stroke-width="1.6" opacity=".55">
    <path d="M210 66V28M322 130l34-20M210 322v38M98 130 64 110M98 258 64 278M322 258l34 20"/>
    <path d="M150 180h-32v-40H78M270 180h32v-40h40M150 240h-32v40H78M270 240h32v40h40"/>
  </g>
  <g fill="#00e5ff">
    <circle cx="210" cy="28" r="3"/><circle cx="356" cy="110" r="3"/><circle cx="210" cy="360" r="3"/>
    <circle cx="64" cy="110" r="3"/><circle cx="64" cy="278" r="3"/><circle cx="356" cy="278" r="3"/>
  </g>

  <!-- stem -->
  <path d="M210 300c0-42 0-74 0-96" fill="none" stroke="url(#stem)" stroke-width="3"/>

  <!-- petals: data-streams -->
  <g filter="url(#glow)" fill="none" stroke="url(#holo)" stroke-width="2.4" stroke-linecap="round">
    <path d="M210 196c-26-6-44-22-48-44 22-2 42 12 48 44z"/>
    <path d="M210 196c26-6 44-22 48-44-22-2-42 12-48 44z"/>
    <path d="M210 200c-22-16-30-38-24-60 20 8 30 32 24 60z" opacity=".8"/>
    <path d="M210 200c22-16 30-38 24-60-20 8-30 32-24 60z" opacity=".8"/>
    <path d="M210 202c-10-22-6-44 10-58 12 18 12 42-10 58z" opacity=".65"/>
  </g>

  <!-- binary stream dots -->
  <g fill="#00e5ff" opacity=".85">
    <circle cx="182" cy="160" r="2.2"/><circle cx="238" cy="152" r="2.2"/><circle cx="210" cy="132" r="2.2"/>
    <circle cx="196" cy="176" r="1.7"/><circle cx="226" cy="170" r="1.7"/>
  </g>

  <!-- core -->
  <circle cx="210" cy="198" r="16" fill="url(#core)"/>
</svg>
