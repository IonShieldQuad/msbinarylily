<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="emblem-title">
  <title id="emblem-title">Ms Binary Lily — two particles chasing each other round a hexagonal orbit</title>
  <!-- Flat-top hexagon, circumradius 8.4 about (12,12). A bead sits at the right vertex and at
       the left one, each trailing a band that runs backwards along two edges and tapers to a
       point: the blue one over the upper-right edges, the red over the lower-left. Both travel
       the SAME way round, so the pair is rotationally symmetric (180°) rather than mirrored —
       mirrored tails are what made the previous four-edge version read as brackets. The neutral
       core (r 1.7) marks the barycentre they orbit and is what carries the mark at 16px.
       Geometry is generated in shots/orbit-lab.html (head bead 2.7, trail half-widths
       2.1 / 1.5 / 0.25); the numbers here are that script's output. -->
  <path d="M22.22 10.95 L16.95 3.43 L7.8 4.48 L7.8 4.98 L15.45 6.02 L18.58 13.05 Z" fill="#2fb8ff"/><circle cx="20.4" cy="12" r="2.7" fill="#2fb8ff"/><path d="M1.78 13.05 L7.05 20.57 L16.2 19.52 L16.2 19.02 L8.55 17.98 L5.42 10.95 Z" fill="#ff7059"/><circle cx="3.6" cy="12" r="2.7" fill="#ff7059"/><circle cx="12" cy="12" r="1.7" fill="#c2ccdb"/>
</svg>
