<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="emblem-title">
  <title id="emblem-title">Ms Binary Lily — a two-pole current running the hexagon's edges</title>
  <!-- The vortex: two arms laid along hexagon edges, never touching, one neutral gap at
       each pole and a neutral core between them. Blue and red are the engine's own poles
       (2f7bff / ff3d5e), so the mark and the live current share one palette. The 0.9 scale
       keeps the 3.4-wide strokes inside the 24 box: the drawn content is centred on (12,12). -->
  <g transform="translate(12 12) scale(.9) translate(-12 -12)" fill="none" stroke-width="3.4" stroke-linejoin="round"><path d="M13.35 2.41 21 7v10l-7.65 4.59" stroke="#2f7bff"/><path d="M10.65 21.59 3 17V7l7.65-4.59" stroke="#ff3d5e"/></g><circle cx="12" cy="12" r="2.2" fill="#8fa2bb"/>
</svg>
